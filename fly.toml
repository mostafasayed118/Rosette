# fly.toml — Rosette deployment config for Fly.io.
# See https://fly.io/docs/reference/configuration/
#
# SECRETS (Supabase service-role key, Paymob API/HMAC keys, Gmail app
# password, Groq key, CRON_SECRET) are NOT listed here. Set them with:
#   fly secrets set CRON_SECRET=... SUPABASE_SERVICE_ROLE_KEY=... ...
# so they are never committed to the repository.

app = 'rosette'
primary_region = 'ams'

[env]
  # Public origin used for payment callbacks and order email links. Replace
  # with your custom domain once it's attached (or the auto-generated
  # <app>.fly.dev host for this app).
  SITE_URL = 'https://rosette.fly.dev'
  PAYMOB_BASE_URL = 'https://accept.paymob.com'
  GROQ_MODEL = 'groq/compound-mini'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
