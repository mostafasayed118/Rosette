name: PR checks

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gates the deploy workflow runs on master: full vitest suite,
      # then typecheck + eslint. Build is intentionally skipped here -
      # merge-time deploy (deploy-cloudflare.yml) owns it.
      - name: Run tests
        run: npm test

      - name: Typecheck and lint
        run: npm run lint

      # Schema-drift gate (R-02 / R-10): fails CI when a local migration has not
      # been applied to the live project (e.g. 038-040 are live-unapplied).
      # Requires SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF (or DATABASE_URL) as
      # repo secrets; when absent the script prints "SKIPPED (no credentials)"
      # and passes, so PRs are not blocked until secrets are configured.
      - name: Check schema drift
        run: node scripts/check-schema-drift.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run deterministic E2E
        run: npm run test:e2e
