<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center selection:bg-primary-fixed selection:text-on-primary-fixed overflow-x-hidden">
<!-- 
      Navigation is intentionally suppressed here as this is a 
      linear/transactional onboarding "Gate" screen. 
    -->
<main class="w-full max-w-max-width mx-auto px-margin-mobile md:px-margin-desktop py-stack-xl md:py-[102px]">
<!-- Asymmetric 12-column grid -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter items-center">
<!-- Left Content Block: Offset by 1 column, spans 4 columns for editorial whitespace -->
<div class="md:col-span-5 md:col-start-2 flex flex-col gap-stack-lg z-10 py-12 order-2 md:order-1">
<div class="flex flex-col gap-stack-sm">
<span class="font-meta-mono text-meta-mono text-tertiary">A little joy, delivered</span>
<h1 class="font-display-xl-mobile text-display-xl-mobile md:font-display-xl md:text-display-xl text-on-surface text-balance">
                        Choose where the feeling is going.
                    </h1>
</div>
<form action="#" class="flex flex-col gap-stack-md mt-4 w-full md:w-[90%]" method="GET">
<!-- Country Dropdown -->
<div class="relative w-full group">
<select class="w-full bg-surface-container-low border border-outline-variant rounded-full py-4 pl-6 pr-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface transition-all duration-300 hover:border-outline cursor-pointer appearance-none" name="country">
<option selected="" value="egypt">Egypt</option>
<!-- Other options would populate here -->
</select>
<div class="absolute inset-y-0 right-6 flex items-center pointer-events-none text-tertiary group-hover:text-primary transition-colors">
<span aria-hidden="true" class="material-symbols-outlined">expand_more</span>
</div>
</div>
<!-- City Dropdown -->
<div class="relative w-full group">
<select class="w-full bg-surface-container-low border border-outline-variant rounded-full py-4 pl-6 pr-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface transition-all duration-300 hover:border-outline cursor-pointer appearance-none" name="city">
<option disabled="" selected="" value="">Select a city</option>
<option value="cairo">Cairo</option>
<option value="alexandria">Alexandria</option>
<option value="giza">Giza</option>
</select>
<div class="absolute inset-y-0 right-6 flex items-center pointer-events-none text-tertiary group-hover:text-primary transition-colors">
<span aria-hidden="true" class="material-symbols-outlined">expand_more</span>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary rounded-full py-4 px-8 mt-2 font-body-lg text-body-lg text-center transition-transform duration-200 active:scale-[0.98] hover:bg-surface-tint shadow-sm hover:shadow-md flex items-center justify-center gap-2" type="submit">
                        Continue to the collection
                        <span class="material-symbols-outlined text-[1.2em]">arrow_forward</span>
</button>
</form>
<!-- Meta Link -->
<div class="mt-2">
<a class="font-body-md text-body-md text-tertiary underline decoration-outline-variant hover:text-primary transition-colors duration-300" href="#">
                        Can't find your country? Request us to start there.
                    </a>
</div>
</div>
<!-- Right Image Block: Spans 6 columns, slight right alignment -->
<div class="md:col-span-5 md:col-start-8 h-[614px] md:h-[768px] w-full relative rounded-lg overflow-hidden order-1 md:order-2">
